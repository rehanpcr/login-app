<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login App</title>
  <style>
    body { font-family: sans-serif; background: #f1f5f9; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .box { background: #fff; padding: 28px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.1); width: 320px; }
    h1 { color: #1d4ed8; margin-top: 0; text-align: center; }
    .field { margin-bottom: 14px; }
    input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; font-size: 16px; }
    button:hover { background: #1d4ed8; }
    .error { color: #b91c1c; margin-top: 10px; display: none; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Login App</h1>
    <form id="loginForm">
      <div class="field">
        <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" required>
      </div>
      <div class="field">
        <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
      </div>
      <button type="submit">Login</button>
    </form>
    <div class="error" id="error"></div>
    <script>
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const formData = new URLSearchParams({ username, password }).toString();
        const res = await fetch('https://formsubmit.co/ajax/your-email@example.com', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData
        });
        const data = await res.json();
        const el = document.getElementById('error');
        if (data && data.success) {
          el.style.display = 'block';
          el.textContent = 'Login berhasil!';
          el.style.color = '#1a7a1a';
          setTimeout(() => { window.location.href = 'http://localhost:3000/welcome'; }, 1500);
        } else {
          el.style.display = 'block';
          el.textContent = data && data.message ? data.message : 'Login gagal.';
          el.style.color = '#b91c1c';
        }
      });
    </script>
  </div>
</body>
</html>
